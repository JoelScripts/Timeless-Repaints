<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeless Repaints Admin | Login</title>
  <link rel="stylesheet" href="public/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Auth guard: redirect to admin if already logged in -->
  <script type="module">
    import { isAuthenticated } from './public/js/auth.js';
    if (isAuthenticated()) {
      window.location.href = 'admin.html';
    }
  </script>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">TIMELESS<span>REPAINTS</span></a>
    </div>
  </nav>

  <section class="admin-page">
    <div class="container">
      <div class="admin-header" style="max-width: 500px; margin: 0 auto 3rem auto;">
        <h1>Admin Login</h1>
        <p>Enter your credentials to access the livery upload area.</p>
      </div>

      <div class="admin-form" style="max-width: 400px; margin: 0 auto;">
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" name="username" placeholder="Username" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" placeholder="Password" required>
        </div>

        <button type="button" id="loginBtn" class="btn btn-success btn-submit" style="width:100%;">Login</button>
      </div>

      <div id="loginResult" style="margin-top: 1rem; text-align: center; min-height: 2rem;"></div>

      <div style="margin-top: 2rem; text-align: center; color: var(--text-dim); font-size: 0.9rem;">
        <a href="index.html" style="color: var(--accent);">← Back to Site</a>
      </div>
    </div>
  </section>

  <script type="module">
    import { setAuth, validateLogin, clearAuth } from './public/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('loginBtn');
      const result = document.getElementById('loginResult');

      btn.addEventListener('click', () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showResult('Please enter both username and password.', 'error');
          return;
        }

        if (validateLogin(username, password)) {
          setAuth({ loggedIn: true, username });
          showResult('Login successful! Redirecting...', 'success');
          setTimeout(() => { window.location.href = 'admin.html'; }, 800);
        } else {
          showResult('Invalid username or password.', 'error');
        }
      });

      // Allow Enter key to submit
      document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') btn.click();
      });
    });

    function showResult(message, type = 'error') {
      const result = document.getElementById('loginResult');
      result.textContent = message;
      result.style.color = type === 'success' ? 'var(--success)' : 'var(--error)';
      result.style.fontWeight = '600';
    }
  </script>
</body>
</html>
