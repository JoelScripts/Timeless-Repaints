<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeless Repaints Admin | Login</title>
  <link rel="stylesheet" href="public/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">TIMELESS<span>REPAINTS</span></a>
    </div>
  </nav>

  <section class="admin-page">
    <div class="container">
      <div class="admin-header" style="max-width: 500px; margin: 0 auto 3rem auto;">
        <h1>Admin Login</h1>
        <p>Enter your GitHub credentials to access the livery upload area.</p>
      </div>

      <div class="admin-form" style="max-width: 500px; margin: 0 auto;">
        <div class="form-group">
          <label for="githubUser">GitHub Username or Organization *</label>
          <input type="text" id="githubUser" name="githubUser" placeholder="e.g. FlyingWithJoel" required>
        </div>

        <div class="form-group">
          <label for="githubRepo">Repository Name *</label>
          <input type="text" id="githubRepo" name="githubRepo" placeholder="e.g. Timeless-Repaints" required>
        </div>

        <div class="form-group">
          <label for="githubToken">Personal Access Token *</label>
          <input type="password" id="githubToken" name="githubToken" placeholder="ghp_xxxxxxxxxxxx" required>
          <p class="form-hint">Create one at: github.com/settings/tokens (needs <code>repo</code> scope)</p>
        </div>

        <div class="form-group">
          <label for="githubBranch">Branch</label>
          <input type="text" id="githubBranch" name="githubBranch" placeholder="main" value="main">
        </div>

        <button type="button" id="loginBtn" class="btn btn-success btn-submit" style="width:100%;">Login</button>
      </div>

      <div id="loginResult" style="margin-top: 1rem; text-align: center; min-height: 2rem;"></div>

      <div style="margin-top: 2rem; text-align: center; color: var(--text-dim); font-size: 0.9rem;">
        <p>Your token is stored locally in your browser only. It is never sent to any server except GitHub's API.</p>
        <a href="index.html" style="color: var(--accent);">← Back to Site</a>
      </div>
    </div>
  </section>

  <script src="public/js/auth.js"></script>
  <script src="public/js/login.js"></script>
</body>
</html>
